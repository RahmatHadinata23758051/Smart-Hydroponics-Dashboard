version: '3.8'

services:
  # ============================================================================
  # Backend API & MQTT / WebSocket Ingestion Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hydro-backend:latest
    container_name: hydro-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9350}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      # MQTT Broker Settings
      - MQTT_HOST=${MQTT_HOST:-sdp.polinela.ac.id}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-septa}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-123321}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-hydro-backend-service}
      - MQTT_BASE_TOPIC=${MQTT_BASE_TOPIC:-hidroponik/lab}
      - MQTT_RELAY_TOPIC=${MQTT_RELAY_TOPIC:-hidroponik/lab/relay}
      # InfluxDB Time-Series (Port unik 9386, fallback otomatis ke SQLite jika token kosong)
      - INFLUX_URL=${INFLUX_URL:-http://localhost:9386}
      - INFLUX_TOKEN=${INFLUX_TOKEN:-}
      - INFLUX_ORG=${INFLUX_ORG:-polinela}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-hydroponics}
      # Persistent SQLite Storage
      - SQLITE_DB_PATH=/app/data/hydro.db
    volumes:
      - hydro_data:/app/data
    networks:
      - hydro_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Frontend Web UI (Nginx + SPA + Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=""
    image: hydro-frontend:latest
    container_name: hydro-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9380}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hydro_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # InfluxDB v2 Service (Opsional - Aktifkan jika ingin InfluxDB lokal dalam Stack)
  # ============================================================================
  # influxdb:
  #   image: influxdb:2.7-alpine
  #   container_name: hydro-influxdb
  #   restart: unless-stopped
  #   ports:
  #     - "${INFLUX_PORT:-9386}:8086"
  #   environment:
  #     - DOCKER_INFLUXDB_INIT_MODE=setup
  #     - DOCKER_INFLUXDB_INIT_USERNAME=admin
  #     - DOCKER_INFLUXDB_INIT_PASSWORD=polinela12345
  #     - DOCKER_INFLUXDB_INIT_ORG=polinela
  #     - DOCKER_INFLUXDB_INIT_BUCKET=hydroponics
  #     - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-}
  #   volumes:
  #     - influx_data:/var/lib/influxdb2
  #   networks:
  #     - hydro_network

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  hydro_data:
    name: hydro_data
    driver: local
  # influx_data:
  #   name: hydro_influx_data
  #   driver: local

networks:
  hydro_network:
    name: hydro_network
    driver: bridge

version: '3.8'

services:
  # ============================================================================
  # InfluxDB v2 Time-Series Database Service (Port Host & Internal: 9386)
  # ============================================================================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: hydro-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUX_PORT:-9386}:9386"
    environment:
      - INFLUXD_HTTP_BIND_ADDRESS=:9386
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD:-polinela12345}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-polinela}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-hydroponics}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-hydro-secret-token-2026}
    volumes:
      - influx_data:/var/lib/influxdb2
    networks:
      - hydro_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9386/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Backend API & MQTT / WebSocket Ingestion Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hydro-backend:v2.0
    container_name: hydro-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9350}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      # MQTT Broker Settings (sesuai firmware config.c)
      - MQTT_HOST=${MQTT_HOST:-sdp.polinela.ac.id}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-septa}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-123321}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-hydro-backend-service}
      - MQTT_BASE_TOPIC=${MQTT_BASE_TOPIC:-hydroponik/unit01}
      - MQTT_LEGACY_TOPICS=${MQTT_LEGACY_TOPICS:-hidroponik/lab,polinela/lab}
      # InfluxDB Time-Series (Terhubung ke port 9386)
      - INFLUX_URL=${INFLUX_URL:-http://influxdb:9386}
      - INFLUX_TOKEN=${INFLUX_TOKEN:-hydro-secret-token-2026}
      - INFLUX_ORG=${INFLUX_ORG:-polinela}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-hydroponics}
      # Persistent SQLite Storage
      - SQLITE_DB_PATH=/app/data/hydro.db
      # Authentication Settings
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-polinela-hydro-2026}
      - AUTH_SECRET=${AUTH_SECRET:-hydro-jwt-super-secret-key-2026}
    volumes:
      - hydro_data:/app/data
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - hydro_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Frontend Web UI (Nginx + SPA + Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hydro-frontend:v2.0
    container_name: hydro-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9380}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hydro_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  hydro_data:
    name: hydro_data
    driver: local
  influx_data:
    name: hydro_influx_data
    driver: local

networks:
  hydro_network:
    name: hydro_network
    driver: bridge
